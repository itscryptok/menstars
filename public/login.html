<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Menstars</title>
<meta name="description" content="Log in or create your free My Engager Network account to build your engager list, star engagers and keep private notes.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{if(localStorage.getItem('menstars-theme')==='night')document.documentElement.setAttribute('data-theme','night')}catch(e){}</script>
<script src="/js/theme.js" defer></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<button id="themeToggle" class="theme-toggle" aria-label="Toggle day/night mode">🌙</button>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/"><img class="logo-mark" src="/logo.webp" alt="Menstars logo"><span>Menstars <small>My Engager Network (MEN)</small></span></a>
  </div>
</header>
<main class="wrap">
  <div class="form-card">
    <h2 id="formTitle">Welcome back</h2>
    <p class="sub" id="formSub">Log in to build your network.</p>
    <div class="form-err" id="formErr"></div>
    <form id="authForm">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" required minlength="8">
      </div>
      <div id="signupNicheWrap" style="display:none">
        <div class="field">
          <label>My niches <span style="color:var(--muted);font-weight:400">(optional — pick all that fit)</span></label>
          <div class="niche-picker" id="signupNichePicker"></div>
        </div>
      </div>
      <button class="btn block" type="submit" id="submitBtn">Log in</button>
    </form>
    <p class="form-switch" id="switchLine">New here? <a href="/login?mode=signup" id="switchLink">Create an account</a></p>
  </div>
</main>
<script src="/js/niche-chips.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
